<svg width="36" height="28" viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Every star twinkles on its own beat, like a night sky. */
    .glow,
    .core {
      transform-box: fill-box;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      .glow {
        animation: twinkle 3.2s ease-in-out infinite;
      }

      .core {
        animation: sparkle 3.2s ease-in-out infinite;
      }

      .s2 { animation-duration: 2.6s; animation-delay: -1.1s; }
      .s3 { animation-duration: 3.8s; animation-delay: -2.3s; }
      .s4 { animation-duration: 2.9s; animation-delay: -0.6s; }
      .s5 { animation-duration: 3.5s; animation-delay: -1.8s; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      45% { opacity: 1; transform: scale(1.45); }
      55% { opacity: 0.9; transform: scale(1.25); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.8; }
      45% { opacity: 1; }
    }
  </style>
  <defs>
    <radialGradient id="lw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <polyline
    points="7,6 13,16 18.5,13 24,23 30,13"
    stroke="#70e61c"
    stroke-width="1.4"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.9"
  />
  <g>
    <circle class="glow s1" cx="7" cy="6" r="3.3" fill="url(#lw)" opacity="0.7" />
    <circle class="glow s2" cx="13" cy="16" r="3.3" fill="url(#lw)" opacity="0.7" />
    <circle class="glow s3" cx="18.5" cy="13" r="3.5" fill="url(#lw)" opacity="0.75" />
    <circle class="glow s4" cx="24" cy="23" r="3.9" fill="url(#lw)" opacity="0.8" />
    <circle class="glow s5" cx="30" cy="13" r="3.3" fill="url(#lw)" opacity="0.7" />
  </g>
  <g fill="#ffffff">
    <circle class="core s1" cx="7" cy="6" r="1.5" />
    <circle class="core s2" cx="13" cy="16" r="1.5" />
    <circle class="core s3" cx="18.5" cy="13" r="1.6" />
    <circle class="core s4" cx="24" cy="23" r="1.9" />
    <circle class="core s5" cx="30" cy="13" r="1.6" />
  </g>
</svg>
