@if (!done()) {
  <div class="intro" aria-hidden="true">
    <div #bg class="intro__bg"></div>
    <canvas #sky class="intro__sky"></canvas>
    <svg #w class="intro__w" viewBox="0 0 36 28">
      <defs>
        <radialGradient id="lw-intro" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
      </defs>
      <polyline #line class="intro__line" points="7,6 13,16 18.5,13 24,23 30,13" />
      <g #stars>
        <g class="intro__star">
          <circle cx="7" cy="6" r="1.6" fill="url(#lw-intro)" opacity="0.25" />
          <polygon class="intro__flare" points="-1.5,6 7,5.84 15.5,6 7,6.16" fill="url(#lw-intro)" />
          <polygon class="intro__flare" points="7,-2.5 6.84,6 7,14.5 7.16,6" fill="url(#lw-intro)" />
          <circle cx="7" cy="6" r="0.6" fill="#ffffff" />
        </g>
        <g class="intro__star">
          <circle cx="13" cy="16" r="1.6" fill="url(#lw-intro)" opacity="0.25" />
          <polygon class="intro__flare" points="4.5,16 13,15.84 21.5,16 13,16.16" fill="url(#lw-intro)" />
          <polygon class="intro__flare" points="13,7.5 12.84,16 13,24.5 13.16,16" fill="url(#lw-intro)" />
          <circle cx="13" cy="16" r="0.6" fill="#ffffff" />
        </g>
        <g class="intro__star">
          <circle cx="18.5" cy="13" r="1.9" fill="url(#lw-intro)" opacity="0.28" />
          <polygon class="intro__flare" points="10,13 18.5,12.82 27,13 18.5,13.18" fill="url(#lw-intro)" />
          <polygon class="intro__flare" points="18.5,4.5 18.32,13 18.5,21.5 18.68,13" fill="url(#lw-intro)" />
          <circle cx="18.5" cy="13" r="0.72" fill="#ffffff" />
        </g>
        <g class="intro__star">
          <circle cx="24" cy="23" r="2" fill="url(#lw-intro)" opacity="0.3" />
          <polygon class="intro__flare" points="15.5,23 24,22.82 32.5,23 24,23.18" fill="url(#lw-intro)" />
          <polygon class="intro__flare" points="24,14.5 23.82,23 24,31.5 24.18,23" fill="url(#lw-intro)" />
          <circle cx="24" cy="23" r="0.8" fill="#ffffff" />
        </g>
        <g class="intro__star">
          <circle cx="30" cy="13" r="1.6" fill="url(#lw-intro)" opacity="0.25" />
          <polygon class="intro__flare" points="21.5,13 30,12.84 38.5,13 30,13.16" fill="url(#lw-intro)" />
          <polygon class="intro__flare" points="30,4.5 29.84,13 30,21.5 30.16,13" fill="url(#lw-intro)" />
          <circle cx="30" cy="13" r="0.6" fill="#ffffff" />
        </g>
      </g>
    </svg>
  </div>
}
