<svg class="logo-mark" viewBox="0 0 36 28" aria-hidden="true">
  <defs>
    <radialGradient [attr.id]="gradientId" cx="50%" cy="50%" r="50%">
      <stop class="logo-mark__stop" offset="0%" />
      <stop class="logo-mark__stop" offset="40%" stop-opacity="0.85" />
      <stop class="logo-mark__stop" offset="100%" stop-opacity="0" />
    </radialGradient>
  </defs>

  <polyline class="logo-mark__line" points="7,6 13,16 18.5,13 24,23 30,13" />

  <g [attr.fill]="glowFill">
    <circle class="logo-mark__glow logo-mark__s1" cx="7" cy="6" r="3.3" opacity="0.7" />
    <circle class="logo-mark__glow logo-mark__s2" cx="13" cy="16" r="3.3" opacity="0.7" />
    <circle class="logo-mark__glow logo-mark__s3" cx="18.5" cy="13" r="3.5" opacity="0.75" />
    <circle class="logo-mark__glow logo-mark__s4" cx="24" cy="23" r="3.9" opacity="0.8" />
    <circle class="logo-mark__glow logo-mark__s5" cx="30" cy="13" r="3.3" opacity="0.7" />
  </g>

  <g>
    <circle class="logo-mark__core logo-mark__s1" cx="7" cy="6" r="1.5" />
    <circle class="logo-mark__core logo-mark__s2" cx="13" cy="16" r="1.5" />
    <circle class="logo-mark__core logo-mark__s3" cx="18.5" cy="13" r="1.6" />
    <circle class="logo-mark__core logo-mark__s4" cx="24" cy="23" r="1.9" />
    <circle class="logo-mark__core logo-mark__s5" cx="30" cy="13" r="1.6" />
  </g>
</svg>
