<dialog
  #dialog
  class="lightbox"
  tabindex="-1"
  [attr.aria-label]="lang.dict().gallery.lightbox"
  (click)="onClick($event)"
  (keydown)="onKeydown($event)"
  (close)="closed.emit()"
>
  <button
    type="button"
    class="lightbox__close"
    [attr.aria-label]="lang.dict().gallery.close"
    (click)="close()"
  >
    <svg class="lightbox__close-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
      />
    </svg>
  </button>

  <img class="lightbox__img" [src]="shot().image" [alt]="shot().alt[lang.lang()]" />

  <div class="lightbox__controls">
    <button
      type="button"
      class="arrow-btn"
      [attr.aria-label]="lang.dict().gallery.prev"
      (click)="step.emit(-1)"
    >
      <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 4l-8 8 8 8" />
      </svg>
    </button>

    <p class="lightbox__counter" aria-live="polite">{{ counter() }}</p>

    <button
      type="button"
      class="arrow-btn"
      [attr.aria-label]="lang.dict().gallery.next"
      (click)="step.emit(1)"
    >
      <svg class="arrow-icon arrow-icon--next" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 4l-8 8 8 8" />
      </svg>
    </button>
  </div>
</dialog>
